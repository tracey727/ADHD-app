<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genevieve — ADHD Personal Organiser</title>
    <!-- Tailwind CSS for rapid, bulletproof styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom smooth progress transitions & UI fine-tuning */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Lock viewports to prevent chaotic scrolling distraction */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans dynamic-theme-container">

    <!-- TOP HEADER / BRANDING -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-8 rounded-xl bg-emerald-500 flex items-center justify-center font-bold text-slate-950 shadow-lg shadow-emerald-500/20">G</div>
                <div>
                    <h1 class="text-md font-semibold tracking-tight">Genevieve</h1>
                    <p class="text-xs text-slate-400">ADHD Brain Organiser</p>
                </div>
            </div>
            <!-- Dynamic Connection State Badge -->
            <div id="connection-status" class="flex items-center space-x-1.5 bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Active Workspace</span>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTROLLER WRAPPER -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

        <!-- ERROR & UNDO BOUNDARY NOTIFICATION TOAST -->
        <div id="global-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 border border-slate-700 shadow-2xl rounded-xl p-4 flex items-center justify-between min-w-[320px] max-w-md animate-bounce">
            <span id="toast-message" class="text-sm text-slate-200">Action performed</span>
            <button id="toast-undo-btn" class="ml-4 text-xs font-bold text-emerald-400 hover:text-emerald-300 uppercase tracking-wider px-2 py-1 rounded hover:bg-slate-700 transition">Undo</button>
        </div>

        <!-- SECTION 1: FRICTIONLESS INPUT / SMART BRAIN DUMP -->
        <section class="bg-slate-800/50 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
            <div class="flex items-center justify-between">
                <label for="brain-dump-input" class="text-xs font-bold tracking-wider text-slate-400 uppercase flex items-center gap-1.5">
                    ⚡ Fast Brain Dump
                </label>
                <span class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded">Auto-parsing active</span>
            </div>
            <div class="relative">
                <input 
                    type="text" 
                    id="brain-dump-input" 
                    placeholder="Type anything (e.g., Call doctor tomorrow at 3pm or Fix code)" 
                    class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 text-slate-100 rounded-xl pl-4 pr-12 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition-all placeholder:text-slate-600"
                />
                <button 
                    id="brain-dump-submit"
                    class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-lg transition font-bold text-xs"
                    aria-label="Capture task"
                >
                    Capture
                </button>
            </div>
        </section>

        <!-- SECTION 2: THE ISOLATED VISUAL WORKSPACE (NOW CONTEXT) -->
        <section id="focus-shield-zone" class="hidden bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-emerald-500/30 rounded-2xl p-6 shadow-2xl relative overflow-hidden transition-all duration-300">
            <div class="absolute -right-16 -top-16 w-48 h-48 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex items-start justify-between relative z-10">
                <div>
                    <span class="text-[10px] font-bold tracking-widest text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full uppercase">Current Single Focus</span>
                    <h2 id="focus-task-title" class="text-xl font-bold text-slate-100 mt-2 tracking-tight">Active Task Hydration</h2>
                    <p id="focus-task-meta" class="text-xs text-slate-400 mt-1 flex items-center gap-2"></p>
                </div>
                <button id="exit-focus-btn" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 transition">
                    Minimize View
                </button>
            </div>

            <!-- TIME BLINDNESS VISUALIZER (POMODORO RING & SLIDERS) -->
            <div class="mt-6 flex flex-col md:flex-row items-center gap-6 bg-slate-950/40 p-4 rounded-xl border border-slate-800/60">
                <div class="relative flex items-center justify-center shrink-0">
                    <svg class="w-24 h-24">
                        <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="40" cx="48" cy="48"/>
                        <circle id="timer-progress-ring" class="text-emerald-500 progress-ring-circle" stroke-width="6" stroke-dasharray="251.2" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="40" cx="48" cy="48"/>
                    </svg>
                    <span id="timer-countdown" class="absolute text-sm font-mono font-bold tracking-tight text-slate-200">25:00</span>
                </div>
                <div class="flex-1 w-full space-y-3">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-400">Focus Momentum Timer</span>
                        <span id="timer-duration-label" class="font-semibold text-emerald-400">25 Mins</span>
                    </div>
                    <input type="range" id="timer-duration-slider" min="5" max="60" step="5" value="25" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    <div class="flex gap-2">
                        <button id="timer-toggle-btn" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-lg text-xs font-bold tracking-wide uppercase transition">Start</button>
                        <button id="timer-buffer-btn" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">+5m Buffer</button>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC TASK SPLITTER (GOBLIN TECH SUBTASKS) -->
            <div class="mt-6 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Micro-Step Breakdown</h3>
                    <button id="auto-split-btn" class="text-[11px] text-emerald-400 hover:text-emerald-300 flex items-center gap-1 font-medium transition">
                        ✨ Auto-Split Task
                    </button>
                </div>
                <div id="focus-subtask-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Micro steps populated dynamically -->
                </div>
            </div>

            <!-- FOOTER DISMISS ACTION -->
            <div class="mt-6 pt-4 border-t border-slate-800/80 flex justify-end">
                <button id="complete-focus-task-btn" class="w-full py-3 bg-emerald-500 text-slate-950 rounded-xl font-bold text-sm hover:bg-emerald-400 shadow-xl shadow-emerald-500/10 transition">
                    Finish Task & Claim Dopamine Clear!
                </button>
            </div>
        </section>

        <!-- SECTION 3: INTERACTIVE BOARD PIPELINES (STRICT COMPARTMENTS) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- PIPELINE A: THE 'NOW & NEXT' STRATIFIED RESERVOIR -->
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                        🎯 Execution Reservoir
                    </h2>
                    <span class="text-[10px] text-slate-500 font-medium">Strict WIP Limits</span>
                </div>

                <!-- NOW COMPARTMENT (MAX 1 TASK LIMITATION) -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>1. Working On Right Now (Limit 1)</span>
                        <span id="now-count" class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded">0/1</span>
                    </div>
                    <div id="compartment-now" class="min-h-[84px] bg-slate-950 border-2 border-dashed border-slate-800 rounded-xl p-2 transition-colors duration-200">
                        <!-- Placed dynamically -->
                    </div>
                </div>

                <!-- NEXT COMPARTMENT (MAX 3 TASK LIMITATION) -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
